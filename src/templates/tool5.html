<form method="post" action="{{ url_for('tool5') }}">
  <label for="quiz">Quiz (Marks: 0 - 40)</label>
  <input id="quiz" type="number" name="quiz" min="0" max="40" required>

  <label for="assignment">Assignment (Marks: 0 - 30)</label>
  <input type="number" name="assignment" id="assignment" min="0" max="30" required>

  <label for="exam">Exam (Marks: 0 - 30)</label>
  <input type="number" name="exam" id="exam" min="0" max="30" required>

  <button type="submit">Calculate now</button>
</form>

{% if result %}
  <p>Total: {{ result.total }}/100</p>
  <p>Grade: {{ result.grade }}</p>
{% endif %}
